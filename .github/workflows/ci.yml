name: CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]

env:
  DOTNET_VERSION: "8.0.x"
  REGISTRY: ${{ secrets.ACR_REGISTRY }}

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore DataLake.sln

      - name: Build
        run: dotnet build DataLake.sln -c Release --no-restore

      - name: Test
        run: dotnet test DataLake.sln -c Release --no-build --logger trx --results-directory TestResults

      - name: Publish test results
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Test Results
          path: TestResults/*.trx
          reporter: dotnet-trx

  docker-build:
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Log in to ACR
        uses: azure/docker-login@v2
        with:
          login-server: ${{ env.REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push ingest worker
        run: |
          docker build -f docker/Dockerfile.ingest -t ${{ env.REGISTRY }}/datalake-ingest:${{ github.sha }} .
          docker push ${{ env.REGISTRY }}/datalake-ingest:${{ github.sha }}

      - name: Build and push batch processor
        run: |
          docker build -f docker/Dockerfile.batch -t ${{ env.REGISTRY }}/datalake-batch:${{ github.sha }} .
          docker push ${{ env.REGISTRY }}/datalake-batch:${{ github.sha }}
